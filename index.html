<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strona w budowie | milotajne.pl</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .maintenance-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        .maintenance-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }
        .maintenance-card h1 {
            font-size: 2rem;
            margin-bottom: 15px;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .maintenance-card p {
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 25px;
        }
        .dc-link {
            color: #818cf8;
            text-decoration: none;
            font-weight: 600;
        }
        .dc-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="maintenance-container">
        <div class="maintenance-card">
            <h1>Strona w budowie 🚀</h1>
            <p>Już niedługo rusza nasza nowa platforma pod marką <strong>milotajne.pl</strong>. Pracujemy nad czymś wyjątkowym!</p>
            <p>W międzyczasie zapraszamy do naszej społeczności na Discordzie:</p>
            <a href="https://dc.milotajne.pl" class="dc-link" target="_blank">Dołącz do dc.milotajne.pl</a>
        </div>
    </div>

</body>
</html>
