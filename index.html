<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiloTajne.pl - Official Survival Server</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #1e1e1e;
            border: 2px solid #333;
            border-radius: 12px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        h1 {
            color: #ffcc00;
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .server-type {
            display: inline-block;
            background-color: #2e7d32;
            color: #fff;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
            margin-bottom: 25px;
            text-transform: uppercase;
        }

        .status-card {
            background-color: #2a2a2a;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background-color: #757575; /* Domyślnie szary */
        }

        .dot.online {
            background-color: #4caf50;
            box-shadow: 0 0 10px #4caf50;
        }

        .dot.offline {
            background-color: #f44336;
            box-shadow: 0 0 10px #f44336;
        }

        .players-count {
            color: #aaa;
            font-size: 0.95rem;
        }

        .ip-box {
            background-color: #111;
            border: 1px dashed #555;
            padding: 15px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 1.2rem;
            color: #ffcc00;
            margin-bottom: 20px;
            user-select: all;
            cursor: pointer;
        }

        .description {
            color: #ccc;
            line-height: 1.6;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>MiloTajne.pl</h1>
        <div class="server-type">Tryb: Survival</div>

        <!-- Kartka statusu serwera -->
        <div class="status-card">
            <div class="status-indicator">
                <div id="status-dot" class="dot"></div>
                <span id="status-text">Sprawdzanie statusu...</span>
            </div>
            <div id="players-text" class="players-count">-/- graczy</div>
        </div>

        <p style="margin-bottom: 8px; color: #888;">Adres IP do dołączenia:</p>
        <div class="ip-box" title="Kliknij, aby skopiować" onclick="navigator.clipboard.writeText('mc.milotajne.pl:51968'); alert('Skopiowano adres IP!');">
            mc.milotajne.pl:51968
        </div>

        <p class="description">
            Witaj na oficjalnym serwerze Survival użytkownika milohak! <br>
            Klasyczna rozgrywka survivalowa – buduj, zwiedzaj i graj ze znajomymi.
        </p>
    </div>

    <script>
        // Adres IP serwera Aternos do sprawdzania stanu przez darmowe API
        const serverIP = "milotajnepl.aternos.me:51968";

        async function checkServerStatus() {
            const statusDot = document.getElementById("status-dot");
            const statusText = document.getElementById("status-text");
            const playersText = document.getElementById("players-text");

            try {
                const response = await fetch(`https://api.mcsrvstat.us/2/${serverIP}`);
                const data = await response.json();

                if (data.online) {
                    statusDot.className = "dot online";
                    statusText.innerText = "ONLINE";
                    statusText.style.color = "#4caf50";
                    playersText.innerText = `${data.players.online}/${data.players.max} graczy`;
                } else {
                    statusDot.className = "dot offline";
                    statusText.innerText = "OFFLINE";
                    statusText.style.color = "#f44336";
                    playersText.innerText = "0/0 graczy";
                }
            } catch (error) {
                statusDot.className = "dot offline";
                statusText.innerText = "BŁĄD SPRAWDZANIA";
                playersText.innerText = "-/- graczy";
            }
        }

        // Sprawdź status po załadowaniu strony
        checkServerStatus();

        // Odświeżaj status automatycznie co 30 sekund
        setInterval(checkServerStatus, 30000);
    </script>

</body>
</html>
